[workspace]
resolver = "2"
members = [
    "crates/nova_core",
    "crates/nova_render",
    "crates/nova_physics",
    "crates/nova_ui",
    "crates/nova_animation",
    "crates/nova_audio",
    "crates/nova_assets",
    "crates/nova_map",
    "crates/nova_character",
    "crates/nova_ai",
    "crates/nova_formation",
    "crates/nova_engine",
    "crates/nova_test",
    "tools/nova_inspector",
    "examples/basic_demo",
    "examples/physics_demo",
    "examples/animation_demo",
    "examples/ui_demo",
    "examples/breakout_3d",
    "examples/rts_demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/nova_engine"
rust-version = "1.80"

[workspace.dependencies]
# Internal crates
nova_core = { path = "crates/nova_core" }
nova_render = { path = "crates/nova_render" }
nova_physics = { path = "crates/nova_physics" }
nova_ui = { path = "crates/nova_ui" }
nova_animation = { path = "crates/nova_animation" }
nova_audio = { path = "crates/nova_audio" }
nova_assets = { path = "crates/nova_assets" }
nova_engine = { path = "crates/nova_engine" }
nova_map = { path = "crates/nova_map" }
nova_character = { path = "crates/nova_character" }
nova_ai = { path = "crates/nova_ai" }
nova_formation = { path = "crates/nova_formation" }
nova_test = { path = "crates/nova_test" }
nova_inspector = { path = "tools/nova_inspector" }

# External dependencies
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_winit",
    "bevy_state",
    "webgpu",
    "tonemapping_luts",
    "ktx2",
    "zstd",
] }
bevy_rapier3d = "0.28"
bevy_egui = "0.31"
wasm-bindgen = "0.2"
log = "0.4"
criterion = "0.5"
noise = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
