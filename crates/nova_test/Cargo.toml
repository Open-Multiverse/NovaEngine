[package]
name = "nova_test"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

description = "Nova Engine 测试工具库 - 提供单元测试、集成测试和 WASM 测试支持"

[dependencies]
bevy.workspace = true
nova_core.workspace = true
nova_render.workspace = true
nova_physics.workspace = true
nova_map.workspace = true
nova_character.workspace = true
nova_ai.workspace = true
nova_formation.workspace = true

log.workspace = true
serde.workspace = true
serde_json.workspace = true

# WASM 测试依赖
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
criterion.workspace = true

[features]
default = ["headless"]
headless = ["bevy/bevy_render", "bevy/bevy_pbr"]
wasm = []

[[bench]]
name = "ecs_benchmarks"
harness = false
