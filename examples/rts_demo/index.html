<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Engine - RTS Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
        }
        #nova-canvas {
            width: 100%;
            height: 100%;
            outline: none;
        }
        #nova-canvas:focus {
            outline: none;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: sans-serif;
            font-size: 18px;
            text-align: center;
        }
        .loading h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #4af;
        }
        .loading p {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <h1>RTS Demo</h1>
        <p>加载中...</p>
    </div>
    <canvas id="nova-canvas" tabindex="0"></canvas>
    <script>
        // 供 WASM 调用的函数：隐藏加载界面（必须在 WASM 加载前定义）
        window.hideLoading = function() {
            document.getElementById('loading').style.display = 'none';
            const canvas = document.getElementById('nova-canvas');
            canvas.focus();
        };
    </script>
    <script type="module">
        import init from './rts_demo.js';

        init().catch(err => {
            document.getElementById('loading').innerHTML = '<h1>加载失败</h1><p>' + err + '</p>';
        });

        // 点击画布时聚焦
        document.getElementById('nova-canvas').addEventListener('click', function() {
            this.focus();
        });
    </script>
</body>
</html>
